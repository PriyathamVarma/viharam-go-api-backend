services:
  - type: web
    name: viharam-go-api-backend
    runtime: go
    buildCommand: go build -tags netgo -ldflags "-s -w" -o app ./cmd/api
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://viharam-go-api-backend.onrender.com
      - key: SUPABASE_STORAGE_BUCKET
        value: viharam-uploads
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
