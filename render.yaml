services:
  - type: web
    name: viharam-go-api-backend
    runtime: go
    buildCommand: go build -tags netgo -ldflags "-s -w" -o app ./cmd/api && go build -tags netgo -ldflags "-s -w" -o migrate ./cmd/migrate
    startCommand: ./migrate && ./app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://viharam-go-api-backend.onrender.com
      - key: SUPABASE_PUBLIC_BUCKET
        value: viharam-public
      - key: SUPABASE_PRIVATE_BUCKET
        value: viharam-private
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
